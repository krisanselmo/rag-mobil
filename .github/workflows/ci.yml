name: CI

# Private repo: minutes are billed (Windows x2). Branch pushes run
# only through their PR to avoid doubled runs; docs-only changes are skipped.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".gitignore", ".gitattributes"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".gitignore", ".gitattributes"]
  workflow_dispatch:

# Un nouveau push annule le run en cours sur la même branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # fmt, clippy, docs, tests and MSRV share one runner and one cache: each job is
  # billed rounded up to the minute and would rebuild the dependencies on its own.
  linux:
    name: Linux (fmt, clippy, tests, docs, MSRV)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Tests hors-ligne uniquement (fixtures HTML), aucun accès réseau ni clé API.
      - run: cargo test --all-targets --locked
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: MSRV (1.88)
        run: cargo +1.88 check --all-targets --locked

  # Windows runners are billed x2: only after merge to main, or on demand.
  windows:
    name: Tests (Windows)
    if: github.event_name != 'pull_request'
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --locked
