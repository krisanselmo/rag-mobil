[package]
name = "rag-mobil"
version = "0.1.0"
edition = "2024"
description = "Générateur d'histoires Playmobil fidèles au contenu de la boîte (RAG : PlaymoDB + LLM)"
repository = "https://github.com/krisanselmo/rag-mobil"
license = "MIT"
rust-version = "1.88"
license = "MIT"
readme = "README.md"
keywords = ["playmobil", "rag", "llm", "story", "children"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
genai = "0.6.5"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "http2", "system-proxy"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "io-util"] }
